<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ludo</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=11">
</head>

<body>
  <div class="app-container">
    <!-- Setup Dashboard -->
    <main id="setup-screen" class="setup-panel">
      <div class="brand">
        <div class="brand-emblem" aria-hidden="true">
          <span class="emblem-dot dot-red"></span>
          <span class="emblem-dot dot-blue"></span>
          <span class="emblem-dot dot-yellow"></span>
          <span class="emblem-dot dot-green"></span>
        </div>
        <h1>Ludo</h1>
        <p class="brand-subtitle">Classic Board Game · Local &amp; Online</p>
      </div>

      <!-- Mode Switcher -->
      <div class="mode-tabs" role="tablist">
        <button type="button" id="tab-local" class="mode-tab active" data-mode="local" role="tab" aria-selected="true">
          Local Game
        </button>
        <button type="button" id="tab-online" class="mode-tab" data-mode="online" role="tab" aria-selected="false">
          Online Room
        </button>
      </div>

      <!-- Local Setup View -->
      <section id="local-setup-view">
        <div class="player-selectors">
          <!-- Player Red (Top-Left) -->
          <div class="selector-card card-red" data-color="red">
            <div class="color-badge badge-red"></div>
            <div class="card-body">
              <input type="text" id="red-name" class="player-name-input" value="Player 1" maxlength="12"
                aria-label="Red player name">
              <div class="type-toggle-group" data-target="red-type">
                <button type="button" class="type-pill active" data-value="human">Player</button>
                <button type="button" class="type-pill" data-value="ai">Bot</button>
                <button type="button" class="type-pill" data-value="off">Off</button>
              </div>
              <input type="hidden" id="red-type" value="human">
            </div>
          </div>

          <!-- Player Blue (Top-Right) -->
          <div class="selector-card card-blue" data-color="blue">
            <div class="color-badge badge-blue"></div>
            <div class="card-body">
              <input type="text" id="blue-name" class="player-name-input" value="Player 2" maxlength="12"
                aria-label="Blue player name">
              <div class="type-toggle-group" data-target="blue-type">
                <button type="button" class="type-pill" data-value="human">Player</button>
                <button type="button" class="type-pill active" data-value="ai">Bot</button>
                <button type="button" class="type-pill" data-value="off">Off</button>
              </div>
              <input type="hidden" id="blue-type" value="ai">
            </div>
          </div>

          <!-- Player Yellow (Bottom-Left) -->
          <div class="selector-card card-yellow is-off" data-color="yellow">
            <div class="color-badge badge-yellow"></div>
            <div class="card-body">
              <input type="text" id="yellow-name" class="player-name-input" value="Player 4" maxlength="12"
                aria-label="Yellow player name">
              <div class="type-toggle-group" data-target="yellow-type">
                <button type="button" class="type-pill" data-value="human">Player</button>
                <button type="button" class="type-pill" data-value="ai">Bot</button>
                <button type="button" class="type-pill active" data-value="off">Off</button>
              </div>
              <input type="hidden" id="yellow-type" value="off">
            </div>
          </div>

          <!-- Player Green (Bottom-Right) -->
          <div class="selector-card card-green is-off" data-color="green">
            <div class="color-badge badge-green"></div>
            <div class="card-body">
              <input type="text" id="green-name" class="player-name-input" value="Player 3" maxlength="12"
                aria-label="Green player name">
              <div class="type-toggle-group" data-target="green-type">
                <button type="button" class="type-pill" data-value="human">Player</button>
                <button type="button" class="type-pill" data-value="ai">Bot</button>
                <button type="button" class="type-pill active" data-value="off">Off</button>
              </div>
              <input type="hidden" id="green-type" value="off">
            </div>
          </div>
        </div>

        <div class="setup-footer">
          <button id="start-game-btn" class="btn btn-primary">Start Game</button>
        </div>
      </section>

      <!-- Online Setup View -->
      <section id="online-setup-view" class="hidden">
        <!-- Entry: Create or Join -->
        <div id="online-entry" class="online-entry">
          <div class="online-field">
            <label for="online-player-name" class="online-label">Your Name</label>
            <input type="text" id="online-player-name" class="player-name-input" value="Player" maxlength="12"
              placeholder="Enter your name">
          </div>

          <div class="online-actions">
            <button type="button" id="create-room-btn" class="btn btn-primary btn-full">Create Room</button>

            <div class="online-divider"><span>or join with code</span></div>

            <div class="join-row">
              <input type="text" id="join-room-code" class="player-name-input code-input" maxlength="6"
                placeholder="ROOM CODE" autocomplete="off">
              <button type="button" id="join-room-btn" class="btn btn-secondary">Join</button>
            </div>
          </div>

          <div id="online-status-msg" class="online-status-msg hidden"></div>
        </div>

        <!-- Lobby: Room Active -->
        <div id="online-lobby" class="online-lobby hidden">
          <div class="room-banner">
            <div class="room-code-box">
              <span class="room-code-label">Room Code</span>
              <span id="lobby-room-code" class="room-code-value">------</span>
            </div>
            <div class="room-share-btns">
              <button type="button" id="copy-code-btn" class="btn btn-secondary btn-sm">Copy Code</button>
              <button type="button" id="copy-link-btn" class="btn btn-secondary btn-sm">Copy Link</button>
            </div>
          </div>

          <div id="lobby-connection-status" class="lobby-status-line">Waiting for players...</div>

          <div id="lobby-slots" class="lobby-slots"></div>

          <div class="lobby-footer">
            <button type="button" id="leave-room-btn" class="btn btn-ghost">Leave</button>
            <button type="button" id="start-online-btn" class="btn btn-primary hidden">Start Game</button>
            <span id="guest-waiting-note" class="guest-waiting-note hidden">Waiting for host to start...</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Main Game Screen -->
    <main id="game-screen" class="game-layout hidden">
      <!-- Board Area -->
      <div class="board-arena">
        <!-- Toast message placed cleanly ABOVE the board -->
        <div class="toast-wrapper">
          <div id="event-toast" class="event-toast hidden"></div>
        </div>

        <div id="board-container" class="board-container">
          <div id="board-wrapper" class="board-wrapper">
            <!-- Exact Authentic 11x11 SVG Board -->
            <svg id="board-svg" class="board-svg" viewBox="0 0 1100 1100"></svg>
            <!-- Overlay Pawns Container -->
            <div id="board-overlays" class="board-overlays"></div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar-layout">
        <!-- Online Room Badge (only shown in online mode) -->
        <div id="game-room-badge" class="sidebar-card room-info-card hidden">
          <div class="room-info-row">
            <span id="game-room-code-text" class="room-info-code">Room: ------</span>
            <span id="game-my-color-tag" class="room-info-role">You: Red</span>
          </div>
        </div>

        <!-- Turn & Dice -->
        <div class="sidebar-card turn-card">
          <div id="active-player-indicator" class="active-player-indicator">
            <div class="color-dot"></div>
            <span id="active-player-name">Player</span>
          </div>

          <div class="dice-container">
            <div id="dice-3d-wrapper" class="dice-3d-wrapper" title="Space or Click to Roll">
              <div id="dice-cube" class="dice-cube show-1">
                <div class="dice-face face-1"><span class="dot"></span></div>
                <div class="dice-face face-2"><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-3"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span></div>
                <div class="dice-face face-4"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-5"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-6"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              </div>
            </div>

            <button id="roll-dice-btn" class="btn btn-primary">Roll Dice</button>
          </div>

          <div id="turn-message" class="turn-status-badge">Roll dice</div>
        </div>

        <!-- Scoreboard -->
        <div class="sidebar-card scoreboard-card">
          <div id="scoreboard-list" class="scoreboard-list"></div>
        </div>

        <!-- Speed & Menu controls -->
        <div class="sidebar-card speed-card">
          <div class="speed-control">
            <span>⚡</span>
            <input type="range" id="speed-slider" min="1" max="4" value="2" step="1" aria-label="Game speed">
            <span id="speed-label" class="speed-tag">Normal</span>
          </div>
          <div class="sidebar-actions">
            <button type="button" id="restart-game-btn" class="btn btn-ghost btn-sm btn-full">Menu / Restart</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Victory Modal -->
  <div id="victory-modal" class="modal hidden">
    <div class="modal-content victory-card">
      <div class="victory-crown">🏆</div>
      <h2 id="winner-title">Victory!</h2>
      <p id="winner-message">Player won the game!</p>
      <button id="victory-restart-btn" class="btn btn-primary">Play Again</button>
    </div>
  </div>

  <!-- MQTT over WebSockets (zero-backend online multiplayer, works on Netlify) -->
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>

  <!-- Game Controller -->
  <script src="src/app.js?v=12"></script>
</body>

</html>
