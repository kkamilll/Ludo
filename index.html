<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="app-container">
    <!-- Setup Dashboard -->
    <main id="setup-screen" class="setup-panel">
      <div class="brand">
        <h1>Ludo</h1>
      </div>

      <div class="player-selectors">
        <!-- Player Red (Top-Left) -->
        <div class="selector-card card-red" data-color="red">
          <div class="color-badge badge-red"></div>
          <div class="card-body">
            <input type="text" id="red-name" class="player-name-input" value="Player 1" maxlength="12">
            <div class="type-toggle-group" data-target="red-type">
              <button type="button" class="type-pill active" data-value="human">Player</button>
              <button type="button" class="type-pill" data-value="ai">Bot</button>
              <button type="button" class="type-pill" data-value="off">Off</button>
            </div>
            <input type="hidden" id="red-type" value="human">
          </div>
        </div>

        <!-- Player Blue (Top-Right) -->
        <div class="selector-card card-blue" data-color="blue">
          <div class="color-badge badge-blue"></div>
          <div class="card-body">
            <input type="text" id="blue-name" class="player-name-input" value="Player 2" maxlength="12">
            <div class="type-toggle-group" data-target="blue-type">
              <button type="button" class="type-pill" data-value="human">Player</button>
              <button type="button" class="type-pill active" data-value="ai">Bot</button>
              <button type="button" class="type-pill" data-value="off">Off</button>
            </div>
            <input type="hidden" id="blue-type" value="ai">
          </div>
        </div>

        <!-- Player Yellow (Bottom-Left) -->
        <div class="selector-card card-yellow" data-color="yellow">
          <div class="color-badge badge-yellow"></div>
          <div class="card-body">
            <input type="text" id="yellow-name" class="player-name-input" value="Player 4" maxlength="12">
            <div class="type-toggle-group" data-target="yellow-type">
              <button type="button" class="type-pill" data-value="human">Player</button>
              <button type="button" class="type-pill" data-value="ai">Bot</button>
              <button type="button" class="type-pill active" data-value="off">Off</button>
            </div>
            <input type="hidden" id="yellow-type" value="off">
          </div>
        </div>

        <!-- Player Green (Bottom-Right) -->
        <div class="selector-card card-green" data-color="green">
          <div class="color-badge badge-green"></div>
          <div class="card-body">
            <input type="text" id="green-name" class="player-name-input" value="Player 3" maxlength="12">
            <div class="type-toggle-group" data-target="green-type">
              <button type="button" class="type-pill" data-value="human">Player</button>
              <button type="button" class="type-pill" data-value="ai">Bot</button>
              <button type="button" class="type-pill active" data-value="off">Off</button>
            </div>
            <input type="hidden" id="green-type" value="off">
          </div>
        </div>
      </div>

      <div class="setup-footer">
        <button id="start-game-btn" class="btn btn-primary">Start Game</button>
      </div>
    </main>

    <!-- Main Game Screen -->
    <main id="game-screen" class="game-layout hidden">
      <!-- Board Area -->
      <div class="board-arena">
        <!-- Toast message placed cleanly ABOVE the board -->
        <div class="toast-wrapper">
          <div id="event-toast" class="event-toast hidden"></div>
        </div>

        <div id="board-container" class="board-container">
          <div id="board-wrapper" class="board-wrapper">
            <!-- Exact Authentic SVG Board Matching Image -->
            <svg id="board-svg" class="board-svg" viewBox="0 0 1100 1100"></svg>
            <!-- Overlay Pawns Container -->
            <div id="board-overlays" class="board-overlays"></div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="sidebar-layout">
        <!-- Turn & Dice -->
        <div class="sidebar-card turn-card">
          <div id="active-player-indicator" class="active-player-indicator">
            <div class="color-dot"></div>
            <span id="active-player-name">Player</span>
          </div>
          
          <div class="dice-container">
            <div id="dice-3d-wrapper" class="dice-3d-wrapper" title="Space or Click to Roll">
              <div id="dice-cube" class="dice-cube show-1">
                <div class="dice-face face-1"><span class="dot"></span></div>
                <div class="dice-face face-2"><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-4"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div class="dice-face face-6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              </div>
            </div>
            
            <button id="roll-dice-btn" class="btn btn-primary">Roll Dice</button>
          </div>

          <div id="turn-message" class="turn-status-badge">Roll dice</div>
        </div>

        <!-- Scoreboard -->
        <div class="sidebar-card scoreboard-card">
          <div id="scoreboard-list" class="scoreboard-list"></div>
        </div>

        <!-- Speed control -->
        <div class="sidebar-card speed-card">
          <div class="speed-control">
            <span>⚡</span>
            <input type="range" id="speed-slider" min="1" max="4" value="2" step="1">
            <span id="speed-label" class="speed-tag">Normal</span>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Victory Modal -->
  <div id="victory-modal" class="modal hidden">
    <div class="modal-content victory-card">
      <div class="victory-crown">🏆</div>
      <h2 id="winner-title">Victory!</h2>
      <p id="winner-message">Player won the game!</p>
      <button id="victory-restart-btn" class="btn btn-primary">Play Again</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="src/app.js?v=8"></script>
</body>
</html>
